context:
  version: "2.5.1"

package:
  name: premise
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/premise/premise-${{ version }}.tar.gz
  sha256: e17fd79541455d114b013a9e2c929b7257bb2dae3905f4fe55b5ab6409a8df0d

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=65.5
    - wheel
  run:
    - bottleneck
    - bw_processing >=1.0
    - bw2calc >=2.0.1
    - bw2data >=4.3
    - bw2io >=0.9.4
    - constructive_geometries >=0.9.5
    - cryptography
    - datapackage
    - ecoinvent_interface
    - numpy <2.0.0
    - pandas
    - platformdirs
    - premise_gwp
    - prettytable
    - pyarrow
    - pycountry
    - python >=${{ python_min }}
    - pyyaml
    - requests
    - schema
    - scipy <1.14.0
    - sparse >=0.14.0
    - tqdm
    - unfold
    - wurst >=0.4
    - xarray <=2024.2.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - premise
      pip_check: false

about:
  homepage: https://premise.readthedocs.io
  summary: 'Coupling IAM output to ecoinvent LCA database ecoinvent for prospective LCA'
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://premise.readthedocs.io
  repository: https://github.com/polca/premise

extra:
  recipe-maintainers:
    - m-rossi
